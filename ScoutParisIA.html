<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<title>Scout Paris IA</title>
<link rel="manifest" id="mf">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bl:#1d4ed8;--bll:#dbeafe;--bll2:#eff6ff;
  --gn:#16a34a;--gnl:#dcfce7;
  --or:#ea580c;--orl:#fff7ed;
  --rd:#dc2626;--rdl:#fee2e2;
  --yw:#ca8a04;--ywl:#fefce8;
  --pu:#7c3aed;
  --grll:#f3f4f6;--bd:#e5e7eb;
  --tx:#111827;--tx2:#6b7280;--tx3:#9ca3af;
  --bg:#f1f5f9;--r:14px;--rs:10px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.05);
  --sh2:0 8px 32px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid var(--bd);padding:0 14px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tl{display:flex;align-items:center;gap:9px}
.tl-logo{font-size:22px}
.tl-name{font-family:'DM Serif Display',serif;font-size:17px}
.tl-sub{font-size:9px;color:var(--tx3);margin-top:-1px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn-sm{padding:6px 11px;border-radius:20px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;white-space:nowrap}
.btn-primary{background:var(--bl);color:#fff}
.btn-primary:disabled{background:var(--bd);color:var(--tx3);cursor:default}
.btn-ghost{background:var(--grll);color:var(--tx2);border:1px solid var(--bd)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--gn);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.main{max-width:640px;margin:0 auto;padding:14px 12px 60px}

/* SETUP SCREEN */
.setup{max-width:460px;margin:60px auto 0;padding:0 16px}
.setup-card{background:#fff;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);padding:28px 24px}
.setup-icon{font-size:48px;text-align:center;margin-bottom:14px}
.setup-title{font-family:'DM Serif Display',serif;font-size:22px;text-align:center;margin-bottom:8px}
.setup-sub{font-size:13px;color:var(--tx2);text-align:center;line-height:1.6;margin-bottom:20px}
.setup-label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.setup-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--bd);font-size:14px;font-family:'Outfit',sans-serif;outline:none;background:#fff;color:var(--tx);transition:border-color .2s;margin-bottom:14px}
.setup-input:focus{border-color:var(--bl)}
.setup-btn{display:block;width:100%;padding:14px;border-radius:11px;border:none;background:var(--bl);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif;transition:opacity .2s;margin-bottom:12px}
.setup-btn:hover{opacity:.88}
.setup-note{font-size:10px;color:var(--tx3);text-align:center;line-height:1.6}
.setup-note a{color:var(--bl)}
.setup-error{background:var(--rdl);border:1px solid var(--rd);color:var(--rd);border-radius:9px;padding:10px 13px;font-size:12px;margin-bottom:12px;display:none}

/* TABS */
.tabs{display:flex;background:#fff;border-radius:var(--r);border:1px solid var(--bd);overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.tab{flex:1;padding:11px 6px;border:none;background:none;font-size:11px;font-weight:700;color:var(--tx2);cursor:pointer;font-family:'Outfit',sans-serif;border-right:1px solid var(--bd)}
.tab:last-child{border-right:none}
.tab.on{background:var(--bl);color:#fff}

/* FILTERS */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fc{padding:5px 11px;border-radius:20px;border:1.5px solid var(--bd);background:#fff;font-size:10px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;font-family:'Outfit',sans-serif;flex-shrink:0}
.fc.on{background:var(--bl);color:#fff;border-color:var(--bl)}

/* STATUS BAR */
.sbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--rs);border:1px solid var(--bd);padding:10px 13px;margin-bottom:12px;box-shadow:var(--sh)}
.sbar-l{display:flex;align-items:center;gap:8px}
.sbar-txt{font-size:11px;font-weight:600}
.sbar-date{font-size:10px;color:var(--tx3);margin-top:1px}
.sbar-r{font-size:11px;color:var(--tx3);text-align:right}

/* TOP 5 */
.t5{background:linear-gradient(135deg,#f59e0b,#fbbf24);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 12px rgba(245,158,11,.3)}
.t5-title{font-size:13px;font-weight:800;color:#78350f;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.t5-date{font-size:10px;font-weight:600;opacity:.8}
.t5-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.78);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;transition:background .15s}
.t5-item:hover{background:rgba(255,255,255,.95)}
.t5-item:last-child{margin-bottom:0}
.t5-medal{font-size:20px;flex-shrink:0}
.t5-info{flex:1;min-width:0}
.t5-lg{font-size:9px;color:#92400e;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.t5-match{font-size:13px;font-weight:800;color:#1c1917;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5-why{font-size:10px;color:#78350f;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5-odds-line{font-size:9px;margin-top:3px;color:#92400e;font-weight:700}
.t5-right{text-align:right;flex-shrink:0}
.t5-pts{font-size:20px;font-weight:900;color:#92400e;line-height:1}
.t5-niv{font-size:9px;font-weight:700;color:#78350f}

/* MATCH CARD */
.mc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .15s}
.mc:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.mc-top{padding:11px 14px 8px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.mc-medal{font-size:18px;flex-shrink:0}
.mc-info{min-width:0}
.mc-league{font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:2px}
.mc-teams{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{padding:4px 9px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap;display:inline-block}
.mc-body{padding:10px 14px}
.bar-wrap{margin-bottom:8px}
.bar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);margin-bottom:3px}
.bar{height:5px;background:var(--bd);border-radius:10px;overflow:hidden}
.bar-f{height:100%;border-radius:10px}
.tr{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:8px}
.tm{flex:1}.tm.r{text-align:right}
.tm-name{font-size:11px;font-weight:700;margin-bottom:2px}
.tm-pts{font-size:10px;color:var(--tx3);margin-bottom:3px}
.dots{display:flex;gap:2px}.dots.r{justify-content:flex-end}
.d{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff}
.d.V{background:var(--gn)}.d.D{background:var(--rd)}.d.N{background:var(--or)}
.vs{font-size:10px;color:var(--bd);font-weight:800;padding-top:12px}
.odds-src{font-size:9px;color:var(--tx3);margin-bottom:5px;display:flex;align-items:center;gap:4px}
.odds-row{display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap}
.ob{flex:1;min-width:50px;background:var(--grll);border-radius:8px;padding:6px 4px;text-align:center;border:1.5px solid var(--bd)}
.ob.best{background:var(--gnl);border-color:var(--gn)}
.ob-lbl{font-size:9px;color:var(--tx3);font-weight:600;margin-bottom:2px}
.ob-val{font-size:13px;font-weight:900}
.ob.best .ob-val{color:var(--gn)}
.ob-bk{font-size:8px;color:var(--tx3);margin-top:1px}
.sum{background:var(--grll);border-radius:8px;padding:8px 10px;font-size:11px;color:var(--tx2);line-height:1.5;margin-bottom:7px}
.pchip{display:inline-flex;align-items:center;gap:3px;margin-top:5px;padding:3px 8px;background:var(--bll);color:var(--bl);border-radius:20px;font-size:9px;font-weight:700}
.btn-an{display:block;width:100%;padding:10px;border:none;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Outfit',sans-serif;color:#fff}

/* CALENDAR */
.cal-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.cal-nav::-webkit-scrollbar{display:none}
.cal-btn{padding:7px 10px;border-radius:12px;border:1.5px solid var(--bd);background:#fff;cursor:pointer;white-space:nowrap;font-family:'Outfit',sans-serif;flex-shrink:0;text-align:center;min-width:58px;transition:all .15s}
.cal-btn .day-num{display:block;font-size:18px;font-weight:900;line-height:1.1}
.cal-btn .day-name{font-size:9px;color:var(--tx3)}
.cal-btn .mc-count{font-size:9px;margin-top:2px;background:var(--grll);border-radius:10px;padding:1px 5px;display:inline-block}
.cal-btn.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.cal-btn.on .day-name{color:rgba(255,255,255,.75)}
.cal-btn.on .mc-count{background:rgba(255,255,255,.25)}
.cal-section{background:#fff;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden}
.cal-hdr{background:var(--bll2);border-bottom:1px solid var(--bd);padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
.cal-hdr-t{font-size:12px;font-weight:800;color:var(--bl)}
.cal-hdr-c{font-size:10px;color:var(--tx3)}
.cal-row{padding:9px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .15s}
.cal-row:last-child{border-bottom:none}
.cal-row:hover{background:var(--grll)}
.cal-time{font-size:10px;color:var(--tx3);font-weight:700;width:36px;flex-shrink:0}
.cal-info{flex:1;min-width:0}
.cal-league{font-size:9px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cal-teams{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ctx{font-size:9px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-right{display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.co{font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;background:var(--grll);border:1px solid var(--bd);cursor:pointer;white-space:nowrap}
.co.hi{background:var(--gnl);border-color:var(--gn);color:var(--gn)}
.cal-empty{text-align:center;padding:28px 16px;color:var(--tx3);font-size:12px}
.cal-load-btn{margin-top:10px;padding:8px 16px;background:var(--bl);color:#fff;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;font-size:12px}

/* SECTION HDR */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sh-title{font-family:'DM Serif Display',serif;font-size:17px}
.sh-meta{font-size:10px;color:var(--tx3)}

/* DETAIL */
.pg-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.btn-bk{padding:6px 12px;border-radius:9px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-size:11px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif}
.pg-t{font-size:13px;font-weight:700}
.det-hero{border-radius:var(--r);padding:18px;text-align:center;color:#fff;margin-bottom:12px;box-shadow:var(--sh2)}
.dh-l{font-size:9px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.dh-m{font-size:16px;font-weight:900;margin-bottom:10px}
.dh-v{font-size:28px;font-weight:900;letter-spacing:1px;margin-bottom:4px}
.dh-r{font-size:12px;opacity:.85;margin-bottom:12px}
.cb-w{max-width:240px;margin:0 auto 12px}
.cb-l{display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px}
.cb{height:7px;background:rgba(255,255,255,.25);border-radius:10px;overflow:hidden}
.cb-f{height:100%;background:#fff;border-radius:10px}
.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.chip{padding:5px 12px;background:rgba(255,255,255,.2);border-radius:20px;font-size:10px;font-weight:700}
.ctx-box{background:var(--bll2);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:11px;color:var(--bl);font-weight:600;line-height:1.5}
.oc{background:#fff;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.oc-title{font-size:11px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.oc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.oc-col{background:var(--grll);border-radius:9px;padding:9px;text-align:center}
.oc-col.best{background:var(--gnl);border:1px solid var(--gn)}
.oc-mkt{font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.oc-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-top:1px solid var(--bd)}
.oc-bk{font-size:9px;color:var(--tx2);font-weight:600}
.oc-odd{font-size:12px;font-weight:900}
.oc-odd.top{color:var(--gn)}
.oc-note{font-size:9px;color:var(--tx3);line-height:1.5;font-style:italic;padding-top:6px;border-top:1px solid var(--bd)}
.src-badge{display:inline-flex;align-items:center;gap:4px;background:var(--bll2);border:1px solid var(--bll);border-radius:6px;padding:3px 8px;font-size:9px;color:var(--bl);font-weight:700;margin-bottom:8px}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--bd);box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.card-t{font-size:11px;font-weight:800;margin-bottom:8px}
.card-tx{font-size:12px;color:var(--tx2);line-height:1.7}
.tc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.tcb{background:#fff;border-radius:11px;border:1px solid var(--bd);box-shadow:var(--sh);padding:12px}
.tcb-n{font-size:11px;font-weight:800;margin-bottom:2px}
.tcb-p{font-size:10px;color:var(--bl);font-weight:700;margin-bottom:3px}
.tcb-s{font-size:9px;color:var(--tx3);margin-bottom:5px}
.tcb-pl{font-size:9px;color:var(--tx2);display:flex;align-items:center;gap:3px;margin-top:2px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.pros,.cons{background:#fff;border-radius:11px;border:1px solid var(--bd);box-shadow:var(--sh);padding:12px}
.pros-t{font-size:10px;font-weight:800;color:var(--gn);margin-bottom:6px}
.cons-t{font-size:10px;font-weight:800;color:var(--rd);margin-bottom:6px}
.pros li,.cons li{font-size:10px;color:var(--tx2);margin-bottom:4px;padding-left:7px;border-left:2px solid;list-style:none;line-height:1.5}
.pros li{border-color:var(--gn)}.cons li{border-color:var(--rd)}
.alt-list{list-style:none}
.alt-list li{font-size:11px;color:var(--tx2);padding:5px 0 5px 9px;border-left:2px solid var(--or);margin-bottom:4px;line-height:1.5}
.final{padding:16px;background:linear-gradient(135deg,var(--bl),#0ea5e9);color:#fff;border-radius:var(--r);margin-bottom:10px;box-shadow:0 4px 16px rgba(29,78,216,.28)}
.final-t{font-size:11px;font-weight:700;opacity:.85;margin-bottom:7px}
.final-tx{font-size:13px;line-height:1.7;font-weight:500}
.al{display:flex;gap:9px;padding:11px 13px;border-radius:10px;margin-bottom:9px;border:1px solid}
.al-i{font-size:16px;flex-shrink:0}
.al-t{font-size:12px;font-weight:700;margin-bottom:1px}
.al-d{font-size:11px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--tx2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi,.fs{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--bd);background:#fff;color:var(--tx);font-size:12px;font-family:'Outfit',sans-serif;outline:none;-webkit-appearance:none}
.fi:focus,.fs:focus{border-color:var(--bl)}
.fg{margin-bottom:11px}

/* LOADING */
.ld{text-align:center;padding:60px 16px}
.ball{font-size:52px;animation:spin 1.1s linear infinite;display:block;margin-bottom:14px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ld-txt{font-size:13px;color:var(--bl);font-weight:700;margin-bottom:13px}
.prog{height:4px;background:var(--bd);border-radius:10px;max-width:240px;margin:0 auto 10px;overflow:hidden}
.prog-f{height:100%;background:linear-gradient(90deg,var(--bl),#7dd3fc);border-radius:10px;animation:prg 1.3s ease-in-out infinite alternate}
@keyframes prg{from{width:8%}to{width:95%}}
.ld-sub{font-size:10px;color:var(--tx3)}

.disc{text-align:center;font-size:9px;color:var(--tx3);padding:6px 0;opacity:.7;line-height:1.5}

/* COLORS */
.nE{background:var(--gnl);color:var(--gn)}.nB{background:#d1fae5;color:#065f46}
.nM{background:var(--ywl);color:var(--yw)}.nR{background:var(--orl);color:var(--or)}.nV{background:var(--rdl);color:var(--rd)}
.bE{background:linear-gradient(90deg,var(--gn),#4ade80)}.bB{background:linear-gradient(90deg,#059669,#34d399)}
.bM{background:linear-gradient(90deg,var(--yw),#fbbf24)}.bR{background:linear-gradient(90deg,var(--or),#fb923c)}.bV{background:linear-gradient(90deg,var(--rd),#f87171)}
.hE{background:linear-gradient(135deg,#059669,#10b981)}.hB{background:linear-gradient(135deg,#16a34a,#22c55e)}
.hM{background:linear-gradient(135deg,#ca8a04,#eab308)}.hR{background:linear-gradient(135deg,#ea580c,#f97316)}.hV{background:linear-gradient(135deg,#dc2626,#ef4444)}.hX{background:linear-gradient(135deg,#6b7280,#9ca3af)}

@media(max-width:480px){.pc,.tc-grid{grid-template-columns:1fr}.oc-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tl">
    <span class="tl-logo">⚽</span>
    <div>
      <div class="tl-name">Scout Paris IA</div>
      <div class="tl-sub" id="tl-sub">Paris sportifs · IA · Monde entier</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="live-dot" id="live-dot" style="display:none"></div>
    <button class="btn-sm btn-ghost" id="btn-key" onclick="showKeySetup()" style="display:none">🔑</button>
    <button class="btn-sm btn-primary" id="btn-rf" onclick="refresh()" disabled>↻</button>
  </div>
</div>

<div id="app"></div>

<script>
// ═══════════════════════════════════════════
//  CONFIG & STATE
// ═══════════════════════════════════════════
const CACHE_TTL  = 6*60*60*1000; // 6h
const BTS=['Victoire équipe A (1)','Match nul (X)','Victoire équipe B (2)','Plus de 2.5 buts','Moins de 2.5 buts','BTTS Oui','BTTS Non','Double chance 1X','Double chance X2','Double chance 12','Handicap -1 équipe A'];
const MEDALS=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
const NC={EXCELLENT:'#16a34a',BON:'#059669',MOYEN:'#ca8a04',RISQUÉ:'#ea580c','ÉVITER':'#dc2626',ERREUR:'#6b7280'};

function nC(n){return{EXCELLENT:'E',BON:'B',MOYEN:'M',RISQUÉ:'R','ÉVITER':'V',ERREUR:'X'}[n]||'M';}
function bC(n){return'b'+nC(n);}
function hC(n){return'h'+nC(n);}
function ic(t,c,tx){return`<div class="card"><div class="card-t" style="color:${c}">${t}</div><div class="card-tx">${tx}</div></div>`;}

function todayISO(){
  const d=new Date();
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function get7Days(){
  const days=[],days_fr=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const months_fr=['jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov','déc'];
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()+i);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    days.push({iso,num:String(d.getDate()),name:days_fr[d.getDay()],month:months_fr[d.getMonth()],isToday:i===0});
  }
  return days;
}
function saveCache(k,v){try{localStorage.setItem(k,JSON.stringify({ts:Date.now(),v}));}catch(e){}}
function loadCache(k){try{const c=JSON.parse(localStorage.getItem(k));if(c&&Date.now()-c.ts<CACHE_TTL)return c.v;}catch(e){}return null;}

// API Anthropic — header CORS obligatoire
async function callClaude(messages, tools=null){
  const body={model:'claude-sonnet-4-20250514',max_tokens:1000,messages};
  if(tools)body.tools=tools;
  const headers={
    'Content-Type':'application/json',
    'x-api-key':S.apiKey,
    'anthropic-version':'2023-06-01',
    'anthropic-dangerous-direct-browser-access':'true',
  };
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body)});
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    throw new Error(err.error?.message||`HTTP ${res.status}`);
  }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}
function parseJSON(text){
  const s=text.indexOf('{'),e=text.lastIndexOf('}');
  if(s<0||e<0)throw new Error('Pas de JSON dans la réponse');
  return JSON.parse(text.slice(s,e+1));
}
function parseJSONArray(text){
  const s=text.indexOf('['),e=text.lastIndexOf(']');
  if(s<0||e<0)return parseJSON(text);
  return JSON.parse(text.slice(s,e+1));
}

async function validateKey(){
  const input=document.getElementById('api-key-input');
  const key=(input?.value||'').trim();
  const errEl=document.getElementById('setup-error');
  if(!key||!key.startsWith('sk-ant')){
    errEl.textContent='Clé invalide. Elle doit commencer par "sk-ant-..."';

      <div class="fg"><label class="fl">💰 Votre cote</label><input class="fi" type="number" step="0.01" placeholder="Ex: 1.75" value="${S.odds||''}"></div>
      <button class="btn-sm btn-primary" style="width:100%;padding:13px;font-size:14px;border-radius:11px" onclick="doAnalyze()">🧠 Analyse IA complète</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════
//  RESULT
// ═══════════════════════════════════════════
function renderResult(){
  const a=S.analysis,m=S.sel;if(!a||!m)return'';
  const n=a.verdict||'MOYEN',nc=nC(n),hc=hC(n);
  const od=m.odds||{};
  const acols={danger:{bg:'#fee2e2',bd:'#dc2626',c:'#dc2626'},warning:{bg:'#fff7ed',bd:'#ea580c',c:'#ea580c'},info:{bg:'#dbeafe',bd:'#1d4ed8',c:'#1d4ed8'},success:{bg:'#dcfce7',bd:'#16a34a',c:'#16a34a'}};
  const aics={danger:'🚨',warning:'⚠️',info:'ℹ️',success:'✅'};
  const alerts=(a.alertes||[]).map(al=>{const col=acols[al.niveau]||acols.info;return`<div class="al" style="background:${col.bg};border-color:${col.bd};color:${col.c}"><span class="al-i">${aics[al.niveau]||'ℹ️'}</span><div><div class="al-t">${al.titre||''}</div><div class="al-d" style="color:var(--tx2)">${al.detail||''}</div></div></div>`;}).join('');
  return`
  <div class="main">
    <div class="pg-hdr"><button class="btn-bk" onclick="goBack()">← Retour</button><div class="pg-t">${m.flag||''} ${m.league||''}</div></div>
    <div class="det-hero ${hc}">
      <div class="dh-l">${m.time||''}</div>
      <div class="dh-m">${m.home} vs ${m.away}</div>
      <div class="dh-v">${a.verdict}</div>
      <div class="dh-r">${a.resume||''}</div>
      <div class="cb-w">
        <div class="cb-l"><span>Confiance IA</span><strong>${a.score_confiance}%</strong></div>
        <div class="cb"><div class="cb-f" style="width:${a.score_confiance}%"></div></div>
      </div>
      <div class="chips"><span class="chip">💰 ${a.mise_recommandee||''}</span>${S.betType?`<span class="chip">🎯 ${S.betType}</span>`:''}</div>
    </div>
    ${alerts}
    ${od.home!=null?`
    <div class="oc">
      <div class="oc-title" style="color:var(--bl)">💰 Cotes · ${S.betType||''}${a.cote_court?` <span style="background:var(--gnl);color:var(--gn);padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700;margin-left:5px">${a.cote_court}</span>`:''}</div>
      ${od.source?`<div class="src-badge">📡 ${od.source}</div>`:''}
      <div class="oc-grid">
        <div class="oc-col${od.best==='home'?' best':''}"><div class="oc-mkt">1 ${m.home.split(' ')[0]}</div>${(od.all_home||[{bk:od.home_bk||'Bk',v:od.home}]).map((b,i)=>`<div class="oc-row"><span class="oc-bk">${b.bk}</span><span class="oc-odd${i===0?' top':''}">${b.v}</span></div>`).join('')}</div>
        <div class="oc-col"><div class="oc-mkt">X Nul</div>${(od.all_draw||[{bk:od.draw_bk||'Bk',v:od.draw||'—'}]).map((b,i)=>`<div class="oc-row"><span class="oc-bk">${b.bk}</span><span class="oc-odd${i===0?' top':''}">${b.v}</span></div>`).join('')}</div>
        <div class="oc-col${od.best==='away'?' best':''}"><div class="oc-mkt">2 ${m.away.split(' ')[0]}</div>${(od.all_away||[{bk:od.away_bk||'Bk',v:od.away||'—'}]).map((b,i)=>`<div class="oc-row"><span class="oc-bk">${b.bk}</span><span class="oc-odd${i===0?' top':''}">${b.v}</span></div>`).join('')}</div>
      </div>
      ${a.analyse_cote?`<div class="oc-note">📊 ${a.analyse_cote}</div>`:''}
    </div>`:''}
    ${a.analyse_match?ic('📋 Analyse du match','var(--bl)',a.analyse_match):''}
    ${a.analyse_joueurs?ic('⭐ Joueurs clés','var(--pu)',a.analyse_joueurs):''}
    ${a.h2h_context?ic('🔄 H2H historique','#0891b2',a.h2h_context):''}
    ${a.analyse_pari?ic(`🎯 "${S.betType||'Pari'}"`,NC[n]||'#6b7280',a.analyse_pari):''}
    <div class="pc">
      <div class="pros"><div class="pros-t">✅ Arguments pour</div><ul>${(a.facteurs_positifs||[]).map(f=>`<li>${f}</li>`).join('')}</ul></div>
      <div class="cons"><div class="cons-t">⚠️ Arguments contre</div><ul>${(a.facteurs_risque||[]).map(f=>`<li>${f}</li>`).join('')}</ul></div>
    </div>
    ${(a.paris_alternatifs||[]).length?`<div class="card"><div class="card-t" style="color:var(--or)">💡 Paris alternatifs</div><ul class="alt-list">${a.paris_alternatifs.map(p=>`<li>${p}</li>`).join('')}</ul></div>`:''}
    <div class="final"><div class="final-t">🧠 Conseil final</div><div class="final-tx">${a.conseil_final||''}</div></div>
    <button class="btn-sm btn-primary" style="width:100%;padding:13px;font-size:14px;border-radius:11px;margin-bottom:10px" onclick="goBack()">← Voir d'autres matchs</button>
    <p class="disc">⚠️ Analyse IA informative · 18+ · Vérifiez les cotes sur les sites bookmakers</p>
  </div>`;
}

// ═══════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════
function refresh(){fetchToday(true);}
function selectCalDay(i){S.calDay=i;render();const d=get7Days()[i];if(!S.calData.hasOwnProperty(d.iso))fetchCalDay(d.iso);}
function selectMatch(id){
  const all=[...S.matches,...Object.values(S.calData).flat()];
  const m=all.find(x=>x.id===id);if(!m)return;
  S.sel=m;S.betType=m.pari_recommande||BTS[0];S.odds='';S.analysis=null;S.screen='detail';render();window.scrollTo(0,0);
}
function goBack(){S.screen='main';render();window.scrollTo(0,0);}
function doAnalyze(){
  S.betType=document.getElementById('bt-sel')?.value||S.betType;
  S.odds=document.querySelector('.fi')?.value||S.odds;
  analyzeMatch();
}

// ═══════════════════════════════════════════
//  FETCH TODAY
// ═══════════════════════════════════════════
async function fetchToday(force=false){
  const iso=todayISO();
  if(!force){
    const c=loadCache('scout_today_'+iso);
    if(c){S.matches=c.matches||[];S.top5=c.top5||[];S.calData[iso]=S.matches;S.lastUpdate=c.lastUpdate;applyTodayData();return;}
  }
  clearInterval(liv);
  S.screen='loading';render();
  const now=new Date();
  const dateStr=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const prompt=`Tu es expert en paris sportifs. Date aujourd'hui : ${dateStr} (${iso}).

Utilise le web search pour trouver les VRAIS matchs de football d'aujourd'hui dans le monde entier sur : soccerbase.com/matches/results.sd?date=${iso}, flashscore.com, livescore.com, tribuna.com

Couvre TOUS les championnats actifs aujourd'hui : PL, Serie A, La Liga, Bundesliga, Ligue 1, Eredivisie, Pro League, Primeira Liga, Süper Lig, Scottish PL, Chance Liga, Eliteserien, Allsvenskan, RPL, Super League Ouzbékistan, Premier League Kazakhstan, Premier League Azerbaïdjan, Premier League Biélorussie, Premier League Arménie, Erovnuli Liga Géorgie, Albanie, Kosovo, Macédoine, Monténégro, Estonie, Lettonie, Lituanie, Islande, Finlande, Malte, Chypre, Féroé, Brasileirao A&B, Liga MX, MLS, J.League, K-League, A-League, Saudi Pro League, et tout autre championnat actif.

Pour chaque match donne : id unique (1,2,3...), league, flag emoji, home, away, time (locale), ctx (contexte court), home_pos, away_pos, home_pts, away_pts, home_forme/away_forme (5 derniers V/N/D), home_bp5/home_bc5/away_bp5/away_bc5, home_top_players/away_top_players (2-3 noms+stats), home_avantage, away_faiblesse, score_potentiel (0-100), niveau (EXCELLENT/BON/MOYEN/RISQUÉ/ÉVITER), pari_recommande, pari_alternative, resume_match (1 phrase), alerte si besoin, odds {home,home_bk,draw,draw_bk,away,away_bk,over25,over25_bk,btts,btts_bk,best,all_home:[{bk,v}],all_draw:[{bk,v}],all_away:[{bk,v}],source,value_note}.

JSON sans backticks :
{"matches":[{...}],"top5_ids":[1,2,3,4,5]}`;

  try{
    const text=await callClaude([{role:'user',content:prompt}],[{type:'web_search_20250305',name:'web_search'}]);
    const parsed=parseJSON(text);
    S.matches=(parsed.matches||[]).sort((a,b)=>(b.score_potentiel||0)-(a.score_potentiel||0));
    S.top5=(parsed.top5_ids||[]).map(id=>S.matches.find(m=>m.id===id)).filter(Boolean);
    if(!S.top5.length)S.top5=S.matches.slice(0,5);
    S.calData[iso]=S.matches;
    S.lastUpdate=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    saveCache('scout_today_'+iso,{matches:S.matches,top5:S.top5,lastUpdate:S.lastUpdate});
  }catch(err){
    S.matches=[];S.top5=[];
    console.error('fetchToday error:',err);
  }
  applyTodayData();
}
function applyTodayData(){
  clearInterval(liv);
  S.screen='main';
  document.getElementById('tl-sub').textContent=`${S.matches.length} matchs · ${S.lastUpdate||''}`;
  document.getElementById('btn-rf').disabled=false;
  render();
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════════
//  FETCH CALENDAR DAY
// ═══════════════════════════════════════════
async function fetchCalDay(iso){
  if(iso===todayISO()){S.calData[iso]=S.matches;render();return;}
  const c=loadCache('scout_cal_'+iso);
  if(c){S.calData[iso]=c;render();return;}
  S.calData[iso]=null; // loading state
  render();
  const d=new Date(iso+'T12:00:00');
  const dateStr=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const prompt=`Expert paris sportifs. Trouve les matchs de football prévus pour le ${dateStr} (${iso}).
Recherche sur soccerbase.com/matches/results.sd?date=${iso}, flashscore.com, livescore.com.
Tous championnats mondiaux.
JSON sans backticks :
{"matches":[{"id":1,"league":"","flag":"","home":"","away":"","time":"","ctx":"","niveau":"MOYEN","score_potentiel":50,"odds":{"home":null,"draw":null,"away":null,"best":null,"source":""}}]}`;
  try{
    const text=await callClaude([{role:'user',content:prompt}],[{type:'web_search_20250305',name:'web_search'}]);
    const parsed=parseJSON(text);
    S.calData[iso]=(parsed.matches||[]).sort((a,b)=>(b.score_potentiel||0)-(a.score_potentiel||0));
    saveCache('scout_cal_'+iso,S.calData[iso]);
  }catch(err){
    S.calData[iso]=[];
  }
  render();
}

// ═══════════════════════════════════════════
//  ANALYZE MATCH
// ═══════════════════════════════════════════
async function analyzeMatch(){
  clearInterval(liv);S.screen='analyzing';render();
  const m=S.sel,bt=S.betType,od=m.odds||{};
  const prompt=`Expert paris sportifs.
Match : ${m.home} (${m.home_pos||'?'}e,${m.home_pts||'?'}pts,${(m.home_forme||[]).join('-')}) vs ${m.away} (${m.away_pos||'?'}e,${m.away_pts||'?'}pts,${(m.away_forme||[]).join('-')})
${m.flag||''} ${m.league||''} · ${m.time||''} · ${m.ctx||''}
${m.home}: ${m.home_bp5||'?'} buts/${m.home_bc5||'?'} enc.(5J) · ${(m.home_top_players||[]).join(', ')}
${m.away}: ${m.away_bp5||'?'} buts/${m.away_bc5||'?'} enc.(5J) · ${(m.away_top_players||[]).join(', ')}
Cotes: 1=${od.home||'?'}(${od.home_bk||''}), X=${od.draw||'?'}, 2=${od.away||'?'}, +2.5=${od.over25||'?'}, BTTS=${od.btts||'?'}
Pari: ${bt} · Cote utilisateur: ${S.odds||'non précisée'}

JSON sans backticks :
{"verdict":"EXCELLENT|BON|MOYEN|RISQUÉ|ÉVITER","score_confiance":0-100,"resume":"phrase","cote_court":"Bonne valeur|Surcotée|Juste","alertes":[{"niveau":"danger|warning|info|success","titre":"","detail":""}],"analyse_match":"paragraphe","analyse_joueurs":"","h2h_context":"","analyse_pari":"","analyse_cote":"","facteurs_positifs":["","",""],"facteurs_risque":["","",""],"conseil_final":"","mise_recommandee":"FAIBLE (1-2% bankroll)|NORMALE (2-3%)|AUCUNE MISE","paris_alternatifs":["",""]}`;
  try{
    const text=await callClaude([{role:'user',content:prompt}],[{type:'web_search_20250305',name:'web_search'}]);
    S.analysis=parseJSON(text);
  }catch(err){
    S.analysis={verdict:'ERREUR',score_confiance:0,resume:'Erreur analyse',alertes:[{niveau:'danger',titre:'Erreur',detail:err.message}],facteurs_positifs:[],facteurs_risque:[],conseil_final:'Réessaie.',mise_recommandee:'AUCUNE MISE',paris_alternatifs:[]};
  }
  clearInterval(liv);S.screen='result';render();window.scrollTo(0,0);
}

(function init(){
